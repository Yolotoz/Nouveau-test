<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Espace gérant — L'Atelier Barbier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="demo-banner hidden" id="demo-banner">Démo : mot de passe « demo »</div>

  <header>
    <nav class="wrap nav">
      <a class="logo" href="index.html">L'Atelier <span>Barbier</span></a>
      <div class="nav-links">
        <a href="index.html">Voir le site</a>
        <button class="btn small ghost hidden" id="logout" type="button">Déconnexion</button>
      </div>
    </nav>
  </header>

  <main class="wrap admin-main">
    <form class="panel login hidden form" id="login" novalidate>
      <h3>Espace gérant</h3>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn" type="submit">Se connecter</button>
    </form>

    <div class="hidden" id="dashboard">
      <div class="toolbar">
        <h2>Rendez-vous à venir</h2>
        <button class="btn small ghost" id="refresh" type="button">↻ Actualiser</button>
      </div>
      <div class="stats">
        <div class="stat"><strong id="stat-today">0</strong><span>aujourd'hui</span></div>
        <div class="stat"><strong id="stat-week">0</strong><span>7 prochains jours</span></div>
        <div class="stat"><strong id="stat-revenue">0 €</strong><span>CA prévu (7 j)</span></div>
      </div>
      <div id="list"></div>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
